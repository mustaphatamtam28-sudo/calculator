<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Use the Simple Calculator for fast basic arithmetic including addition, subtraction, multiplication, and division.">
  <title>Simple Calculator | CalcTools Hub</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --border: #dbe3f0;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
    header, footer { background: #fff; border-bottom: 1px solid var(--border); }
    footer { border-top: 1px solid var(--border); border-bottom: none; }
    .brand { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 18px 0; }
    .brand a { text-decoration: none; color: var(--primary); font-weight: bold; }
    .hero { margin: 24px 0; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; padding: 28px; border-radius: var(--radius); box-shadow: var(--shadow); }
    .hero h1 { margin: 0 0 10px; font-size: 2rem; }
    .layout { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 20px; align-items: start; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
    label { display: block; font-weight: bold; margin: 14px 0 6px; }
    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
      background: #fff;
    }
    button {
      margin-top: 16px;
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: var(--primary-dark); }
    .result {
      margin-top: 18px;
      padding: 16px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      min-height: 60px;
      word-break: break-word;
    }
    .info h2 { margin-top: 0; }
    .info p { color: var(--muted); }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .hero h1 { font-size: 1.6rem; } }
  </style>
</head>
<body>
  <header>
    <div class="container brand">
      <div><a href="index.html">CalcTools Hub</a></div>
      <nav><a href="index.html">Home</a></nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Simple Calculator</h1>
      <p>Perform basic arithmetic quickly and easily.</p>
    </section>

    <div class="layout">
      <section class="card">
        <h2>Calculator</h2>
        <label for="num1">First number</label>
        <input type="number" id="num1" placeholder="Enter first number">

        <label for="operation">Operation</label>
        <select id="operation">
          <option value="add">Addition (+)</option>
          <option value="subtract">Subtraction (-)</option>
          <option value="multiply">Multiplication (×)</option>
          <option value="divide">Division (÷)</option>
        </select>

        <label for="num2">Second number</label>
        <input type="number" id="num2" placeholder="Enter second number">

        <button onclick="calculate()">Calculate</button>
        <div class="result" id="result">Your result will appear here.</div>
      </section>

      <aside class="card info">
        <h2>About This Tool</h2>
        <p>This calculator supports the four main arithmetic operations.</p>
      </aside>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 CalcTools Hub. All rights reserved.</p>
    </div>
  </footer>

  <script>
    function calculate() {
      const num1 = parseFloat(document.getElementById('num1').value);
      const num2 = parseFloat(document.getElementById('num2').value);
      const operation = document.getElementById('operation').value;
      const result = document.getElementById('result');

      if (isNaN(num1) || isNaN(num2)) {
        result.textContent = 'Please enter valid numbers.';
        return;
      }

      let output;

      switch (operation) {
        case 'add':
          output = num1 + num2;
          break;
        case 'subtract':
          output = num1 - num2;
          break;
        case 'multiply':
          output = num1 * num2;
          break;
        case 'divide':
          output = num2 !== 0 ? num1 / num2 : 'Cannot divide by zero';
          break;
      }

      result.innerHTML = `<strong>Result:</strong> ${output}`;
    }
  </script>
</body>
</html>
