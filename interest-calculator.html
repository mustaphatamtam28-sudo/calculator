<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interest Calculator | CalcTools Hub</title>
  <meta name="description" content="Calculate simple interest and total amount with this free online interest calculator." />
  <meta name="keywords" content="interest calculator, simple interest calculator, finance calculator" />
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; color: #1f2937; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    header, footer { text-align: center; padding: 20px 0; }
    nav a { color: #2563eb; text-decoration: none; margin: 0 10px; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.08); padding: 20px; margin-bottom: 20px; }
    label { display: block; margin: 12px 0 8px; font-weight: 700; }
    input, button {
      width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 12px;
      border: 1px solid #d1d5db; font-size: 16px;
    }
    button { background: #2563eb; color: #fff; border: 0; cursor: pointer; margin-top: 14px; }
    button:hover { background: #1d4ed8; }
    .result { margin-top: 16px; padding: 14px; background: #eff6ff; border-radius: 12px; }
    .muted { color: #6b7280; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Interest Calculator</h1>
      <p class="muted">Calculate simple interest and total repayment.</p>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <section class="card">
        <label for="principal">Principal amount</label>
        <input id="principal" type="number" step="any" placeholder="Example: 1000" />
        <label for="rate">Interest rate (%)</label>
        <input id="rate" type="number" step="any" placeholder="Example: 5" />
        <label for="time">Time (years)</label>
        <input id="time" type="number" step="any" placeholder="Example: 2" />
        <button onclick="calculateInterest()">Calculate</button>
        <div id="result" class="result" style="display:none;"></div>
      </section>

      <section class="card">
        <h2>How it works</h2>
        <p class="muted">
          Simple interest is calculated using principal × rate × time. The total amount is the principal plus interest.
        </p>
      </section>
    </main>

    <footer class="muted">
      <p>&copy; 2026 CalcTools Hub</p>
    </footer>
  </div>

  <script>
    function calculateInterest() {
      const principal = parseFloat(document.getElementById('principal').value);
      const rate = parseFloat(document.getElementById('rate').value);
      const time = parseFloat(document.getElementById('time').value);
      const resultDiv = document.getElementById('result');

      if (isNaN(principal) || isNaN(rate) || isNaN(time)) {
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = 'Please enter valid numbers.';
        return;
      }

      const interest = (principal * rate * time) / 100;
      const total = principal + interest;

      resultDiv.style.display = 'block';
      resultDiv.innerHTML = `Interest: ${interest.toFixed(2)}<br>Total Amount: ${total.toFixed(2)}`;
    }
  </script>
</body>
</html>
