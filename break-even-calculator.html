<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Break-Even Calculator | CalcTools Hub</title>
  <meta name="description" content="Calculate the break-even point for your business with this free online break-even calculator." />
  <meta name="keywords" content="break even calculator, business calculator, profit calculator" />
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; color: #1f2937; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    header, footer { text-align: center; padding: 20px 0; }
    nav a { color: #2563eb; text-decoration: none; margin: 0 10px; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.08); padding: 20px; margin-bottom: 20px; }
    label { display: block; margin: 12px 0 8px; font-weight: 700; }
    input, button {
      width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 12px;
      border: 1px solid #d1d5db; font-size: 16px;
    }
    button { background: #2563eb; color: #fff; border: 0; cursor: pointer; margin-top: 14px; }
    button:hover { background: #1d4ed8; }
    .result { margin-top: 16px; padding: 14px; background: #eff6ff; border-radius: 12px; }
    .muted { color: #6b7280; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Break-Even Calculator</h1>
      <p class="muted">Find the number of units needed to break even.</p>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <section class="card">
        <label for="fixedCosts">Fixed costs</label>
        <input id="fixedCosts" type="number" step="any" placeholder="Example: 1000" />
        <label for="pricePerUnit">Price per unit</label>
        <input id="pricePerUnit" type="number" step="any" placeholder="Example: 25" />
        <label for="variableCost">Variable cost per unit</label>
        <input id="variableCost" type="number" step="any" placeholder="Example: 10" />
        <button onclick="calculateBreakEven()">Calculate</button>
        <div id="result" class="result" style="display:none;"></div>
      </section>

      <section class="card">
        <h2>How it works</h2>
        <p class="muted">
          Break-even point = fixed costs divided by the difference between price per unit and variable cost per unit.
        </p>
      </section>
    </main>

    <footer class="muted">
      <p>&copy; 2026 CalcTools Hub</p>
    </footer>
  </div>

  <script>
    function calculateBreakEven() {
      const fixedCosts = parseFloat(document.getElementById('fixedCosts').value);
      const pricePerUnit = parseFloat(document.getElementById('pricePerUnit').value);
      const variableCost = parseFloat(document.getElementById('variableCost').value);
      const resultDiv = document.getElementById('result');

      if (isNaN(fixedCosts) || isNaN(pricePerUnit) || isNaN(variableCost)) {
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = 'Please enter valid numbers.';
        return;
      }

      const contributionMargin = pricePerUnit - variableCost;
      if (contributionMargin <= 0) {
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = 'Price per unit must be greater than variable cost per unit.';
        return;
      }

      const breakEvenUnits = fixedCosts / contributionMargin;
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = `Break-Even Point: ${breakEvenUnits.toFixed(2)} units`;
    }
  </script>
</body>
</html>
