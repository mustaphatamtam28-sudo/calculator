<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculator Website - 200+ Free Calculation Tools for Finance, Health & Fitness, Everyday Life and More">
    <meta name="keywords" content="calculator, financial calculator, health calculator, conversion tools, free online calculators">
    <title>Calculator Hub - 200+ Free Online Calculators</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header with Logo -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <h1>🧮 Calculator Hub</h1>
                <p>200+ Free Calculation Tools</p>
            </div>
        </div>
    </header>

    <!-- Google AdSense Ad Space (Top) -->
    <div class="ad-space">
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-xxxxxxxxxxxxxxxx"
            crossorigin="anonymous"></script>
        <ins class="adsbygoogle"
            style="display:block"
            data-ad-client="ca-pub-xxxxxxxxxxxxxxxx"
            data-ad-slot="1234567890"
            data-ad-format="auto"
            data-full-width-responsive="true"></ins>
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <!-- Search Bar -->
    <div class="search-container">
        <div class="container">
            <input 
                type="text" 
                id="searchInput" 
                class="search-bar" 
                placeholder="Search for a calculator... (e.g: mortgage calculator)"
            >
            <div id="searchResults" class="search-results" style="display: none;"></div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container">
        <!-- Categories Section -->
        <section id="categoriesContainer" class="categories-section">
            <!-- Categories will be loaded here by JavaScript -->
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Calculator Hub. All rights reserved.</p>
            <p>Last Updated: <span id="lastUpdate"></span></p>
            <p>
                <a href="#privacy">Privacy Policy</a> | 
                <a href="#terms">Terms & Conditions</a> | 
                <a href="#contact">Contact Us</a>
            </p>
        </div>
    </footer>

    <!-- Google AdSense Ad Space (Bottom) -->
    <div class="ad-space">
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-xxxxxxxxxxxxxxxx"
            crossorigin="anonymous"></script>
        <ins class="adsbygoogle"
            style="display:block"
            data-ad-client="ca-pub-xxxxxxxxxxxxxxxx"
            data-ad-slot="0987654321"
            data-ad-format="auto"
            data-full-width-responsive="true"></ins>
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <!-- Main Script -->
    <script>
        // Fetch tools data
        fetch('tools.json')
            .then(response => response.json())
            .then(data => {
                renderCategories(data.categories);
                setupSearch(data.categories);
                updateLastModified();
            })
            .catch(error => console.error('Error loading tools:', error));

        // Render Categories and Tools
        function renderCategories(categories) {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = '';

            categories.forEach(category => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category';
                categoryDiv.id = category.id;

                let toolsHTML = '';
                category.tools.forEach(tool => {
                    toolsHTML += `
                        <div class="tool-card" data-tool-id="${tool.id}">
                            <div class="tool-icon">📱</div>
                            <h3>${tool.name}</h3>
                            <p>${tool.description}</p>
                            <a href="calculator.html?tool=${tool.id}" class="btn-open">Open Tool →</a>
                        </div>
                    `;
                });

                categoryDiv.innerHTML = `
                    <div class="category-header">
                        <h2>${category.icon} ${category.name}</h2>
                    </div>
                    <div class="tools-grid">
                        ${toolsHTML}
                    </div>
                    <hr>
                `;

                container.appendChild(categoryDiv);
            });
        }

        // Setup Search Functionality
        function setupSearch(categories) {
            const searchInput = document.getElementById('searchInput');
            const searchResults = document.getElementById('searchResults');

            searchInput.addEventListener('input', function() {
                const query = this.value.toLowerCase();

                if (query.length === 0) {
                    searchResults.style.display = 'none';
                    return;
                }

                const results = [];
                categories.forEach(category => {
                    category.tools.forEach(tool => {
                        if (
                            tool.name.toLowerCase().includes(query) ||
                            tool.description.toLowerCase().includes(query)
                        ) {
                            results.push({
                                ...tool,
                                categoryName: category.name
                            });
                        }
                    });
                });

                if (results.length > 0) {
                    searchResults.innerHTML = results.map(result => `
                        <div class="search-result-item">
                            <strong>${result.name}</strong><br>
                            <small>${result.categoryName}</small><br>
                            <a href="calculator.html?tool=${result.id}">Open →</a>
                        </div>
                    `).join('');
                    searchResults.style.display = 'block';
                } else {
                    searchResults.innerHTML = '<div class="search-result-item">No results found</div>';
                    searchResults.style.display = 'block';
                }
            });

            // Hide search results when clicking outside
            document.addEventListener('click', function(e) {
                if (e.target !== searchInput) {
                    searchResults.style.display = 'none';
                }
            });
        }

        // Update Last Modified Date
        function updateLastModified() {
            const today = new Date();
            const dateString = today.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            document.getElementById('lastUpdate').textContent = dateString;
        }
    </script>
</body>
</html>
