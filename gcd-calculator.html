<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GCD Calculator | CalcTools Hub</title>
  <meta name="description" content="Calculate the greatest common divisor (GCD) of two numbers with this free online calculator." />
  <meta name="keywords" content="gcd calculator, greatest common divisor, hcf calculator" />
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; color: #1f2937; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    header, footer { text-align: center; padding: 20px 0; }
    nav a { color: #2563eb; text-decoration: none; margin: 0 10px; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.08); padding: 20px; margin-bottom: 20px; }
    label { display: block; margin: 12px 0 8px; font-weight: 700; }
    input, button {
      width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 12px;
      border: 1px solid #d1d5db; font-size: 16px;
    }
    button { background: #2563eb; color: #fff; border: 0; cursor: pointer; margin-top: 14px; }
    button:hover { background: #1d4ed8; }
    .result { margin-top: 16px; padding: 14px; background: #eff6ff; border-radius: 12px; }
    .muted { color: #6b7280; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>GCD Calculator</h1>
      <p class="muted">Find the greatest common divisor of two numbers.</p>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <section class="card">
        <label for="num1">First number</label>
        <input id="num1" type="number" placeholder="Example: 24" />
        <label for="num2">Second number</label>
        <input id="num2" type="number" placeholder="Example: 36" />
        <button onclick="calculateGCD()">Calculate GCD</button>
        <div id="result" class="result" style="display:none;"></div>
      </section>

      <section class="card">
        <h2>How it works</h2>
        <p class="muted">
          The greatest common divisor is the largest positive integer that divides both numbers without leaving a remainder.
        </p>
      </section>
    </main>

    <footer class="muted">
      <p>&copy; 2026 CalcTools Hub</p>
    </footer>
  </div>

  <script>
    function gcd(a, b) {
      while (b !== 0) {
        [a, b] = [b, a % b];
      }
      return Math.abs(a);
    }

    function calculateGCD() {
      const a = parseInt(document.getElementById('num1').value, 10);
      const b = parseInt(document.getElementById('num2').value, 10);
      const resultDiv = document.getElementById('result');

      if (isNaN(a) || isNaN(b)) {
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = 'Please enter two valid numbers.';
        return;
      }

      resultDiv.style.display = 'block';
      resultDiv.innerHTML = `GCD: ${gcd(a, b)}`;
    }
  </script>
</body>
</html>
