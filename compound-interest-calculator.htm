<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compound Interest Calculator | CalcTools Hub</title>
  <meta name="description" content="Calculate compound interest, final amount, and growth with this free online compound interest calculator." />
  <meta name="keywords" content="compound interest calculator, investment calculator, interest growth calculator" />
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; color: #1f2937; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    header, footer { text-align: center; padding: 20px 0; }
    nav a { color: #2563eb; text-decoration: none; margin: 0 10px; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.08); padding: 20px; margin-bottom: 20px; }
    label { display: block; margin: 12px 0 8px; font-weight: 700; }
    input, button, select {
      width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 12px;
      border: 1px solid #d1d5db; font-size: 16px;
    }
    button { background: #2563eb; color: #fff; border: 0; cursor: pointer; margin-top: 14px; }
    button:hover { background: #1d4ed8; }
    .result { margin-top: 16px; padding: 14px; background: #eff6ff; border-radius: 12px; }
    .muted { color: #6b7280; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Compound Interest Calculator</h1>
      <p class="muted">Calculate compound growth over time.</p>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <section class="card">
        <label for="principal">Principal amount</label>
        <input id="principal" type="number" step="any" placeholder="Example: 1000" />
        <label for="rate">Annual interest rate (%)</label>
        <input id="rate" type="number" step="any" placeholder="Example: 5" />
        <label for="times">Compounded times per year</label>
        <input id="times" type="number" step="1" placeholder="Example: 12" />
        <label for="years">Time (years)</label>
        <input id="years" type="number" step="any" placeholder="Example: 3" />
        <button onclick="calculateCompoundInterest()">Calculate</button>
        <div id="result" class="result" style="display:none;"></div>
      </section>

      <section class="card">
        <h2>How it works</h2>
        <p class="muted">
          Compound interest grows on both the original principal and the accumulated interest. The more frequently it compounds, the faster the balance grows.
        </p>
      </section>
    </main>

    <footer class="muted">
      <p>&copy; 2026 CalcTools Hub</p>
    </footer>
  </div>

  <script>
    function calculateCompoundInterest() {
      const principal = parseFloat(document.getElementById('principal').value);
      const rate = parseFloat(document.getElementById('rate').value);
      const times = parseFloat(document.getElementById('times').value);
      const years = parseFloat(document.getElementById('years').value);
      const resultDiv = document.getElementById('result');

      if (isNaN(principal) || isNaN(rate) || isNaN(times) || isNaN(years)) {
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = 'Please enter valid numbers.';
        return;
      }

      const amount = principal * Math.pow((1 + (rate / 100) / times), times * years);
      const interest = amount - principal;

      resultDiv.style.display = 'block';
      resultDiv.innerHTML = `Interest: ${interest.toFixed(2)}<br>Final Amount: ${amount.toFixed(2)}`;
    }
  </script>
</body>
</html>
