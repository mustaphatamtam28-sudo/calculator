<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tip Calculator | CalcTools Hub</title>
  <meta name="description" content="Calculate tip amount and total bill quickly with this free online tip calculator." />
  <meta name="keywords" content="tip calculator, gratuity calculator, bill calculator" />
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; color: #1f2937; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    header, footer { text-align: center; padding: 20px 0; }
    nav a { color: #2563eb; text-decoration: none; margin: 0 10px; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.08); padding: 20px; margin-bottom: 20px; }
    label { display: block; margin: 12px 0 8px; font-weight: 700; }
    input, button {
      width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 12px;
      border: 1px solid #d1d5db; font-size: 16px;
    }
    button { background: #2563eb; color: #fff; border: 0; cursor: pointer; margin-top: 14px; }
    button:hover { background: #1d4ed8; }
    .result { margin-top: 16px; padding: 14px; background: #eff6ff; border-radius: 12px; }
    .muted { color: #6b7280; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Tip Calculator</h1>
      <p class="muted">Calculate tip and split the bill easily.</p>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <section class="card">
        <label for="billAmount">Bill amount</label>
        <input id="billAmount" type="number" step="any" placeholder="Example: 50" />
        <label for="tipPercent">Tip percentage</label>
        <input id="tipPercent" type="number" step="any" placeholder="Example: 15" />
        <button onclick="calculateTip()">Calculate</button>
        <div id="result" class="result" style="display:none;"></div>
      </section>

      <section class="card">
        <h2>How it works</h2>
        <p class="muted">
          Enter the bill amount and tip percentage to see the tip amount and the total bill.
        </p>
      </section>
    </main>

    <footer class="muted">
      <p>&copy; 2026 CalcTools Hub</p>
    </footer>
  </div>

  <script>
    function calculateTip() {
      const billAmount = parseFloat(document.getElementById('billAmount').value);
      const tipPercent = parseFloat(document.getElementById('tipPercent').value);
      const resultDiv = document.getElementById('result');

      if (isNaN(billAmount) || isNaN(tipPercent)) {
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = 'Please enter valid numbers.';
        return;
      }

      const tip = billAmount * (tipPercent / 100);
      const total = billAmount + tip;

      resultDiv.style.display = 'block';
      resultDiv.innerHTML = `Tip Amount: ${tip.toFixed(2)}<br>Total Bill: ${total.toFixed(2)}`;
    }
  </script>
</body>
</html>
